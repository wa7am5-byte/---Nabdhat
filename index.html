<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبضات Messenger - حقيقي وبث مباشر</title>

    <!-- Firebase SDK (Version 9 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff2a5f;
            --primary-grad: linear-gradient(135deg, #ff2a5f 0%, #ff6b81 100%);
            --bg-dark: #0f0c20;
            --card-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --msg-out: linear-gradient(135deg, #ff2a5f, #ba2661);
            --msg-in: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #2a0845, #0f0c20 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background: rgba(20, 15, 38, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        @media (min-width: 480px) {
            .app-container {
                border-radius: 35px;
                height: 92vh;
            }
        }

        /* --- شاشة التسجيل والتسجيل الحقيقي عبر Firebase --- */
        .auth-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            transition: all 0.5s ease;
        }

        .auth-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header h1 {
            font-size: 2rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-grad);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 42, 95, 0.35);
            margin-top: 10px;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .auth-toggle span {
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
        }

        /* --- الهيدر والواجهات --- */
        .app-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-glass);
            z-index: 10;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .icon-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .page {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        /* --- قائمة الدردشات --- */
        .chat-list {
            padding: 15px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 18px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }

        /* --- غرفة الدردشة --- */
        .chat-room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-glass);
        }

        .messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg.in {
            align-self: flex-start;
            background: var(--msg-in);
            border-bottom-right-radius: 4px;
        }

        .msg.out {
            align-self: flex-end;
            background: var(--msg-out);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-top: 3px;
            display: block;
        }

        .chat-bar {
            padding: 10px 15px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-glass);
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            outline: none;
            font-size: 0.88rem;
        }

        .fab {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--primary-grad);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 8px 25px rgba(255, 42, 95, 0.5);
            cursor: pointer;
            border: none;
            color: white;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 🔐 شاشة التسجيل والتسجيل الحقيقي عبر Firebase -->
    <div class="auth-screen" id="auth-screen">
        <div class="auth-header">
            <h1>نبضات Messenger ❤️</h1>
            <p id="auth-subtitle" style="font-size: 0.8rem; color: var(--text-sub);">سجل حساب حقيقي للتواصل الفوري</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group" id="group-name" style="display: none;">
                <label>الاسم الكامل</label>
                <input type="text" id="auth-name" placeholder="اسمك الذي سيظهر للمستخدمين">
            </div>

            <div class="input-group" id="group-avatar" style="display: none;">
                <label>الأفاتار</label>
                <select id="auth-avatar">
                    <option value="👑">👑 ملك / ملكة</option>
                    <option value="💖">💖 قلب</option>
                    <option value="🌹">🌹 وردة</option>
                    <option value="🕊">🕊️ طير</option>
                </select>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني الحقيقي</label>
                <input type="email" id="auth-email" placeholder="example@mail.com" required>
            </div>

            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="auth-pass" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn-primary" id="auth-btn">تسجيل الدخول</button>
        </form>

        <div class="auth-toggle">
            <span id="toggle-text">ليس لديك حساب؟</span>
            <span id="toggle-link" onclick="toggleAuthMode()"> إنشاء حساب جديد</span>
        </div>
    </div>

    <!-- 🔝 الشريط العلوي -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="user-avatar" id="my-avatar">👑</div>
            <div>
                <div style="font-weight: bold; font-size: 1rem;" id="my-name">المحادثات</div>
                <div style="font-size: 0.65rem; color: #00ff88;">حقيقي ومباشر 🟢</div>
            </div>
        </div>
        <button class="icon-btn" onclick="logout()" title="تسجيل الخروج">🚪</button>
    </header>

    <!-- 📱 المحتوى الرئيسي -->
    <main class="app-content">

        <!-- 1️⃣ صفحة قائمة المحادثات -->
        <section id="page-chats" class="page active">
            <div class="chat-list" id="chats-container"></div>
            <button class="fab" onclick="startNewRealChat()" title="بدء محادثة مع مستخدم آخر">➕</button>
        </section>

        <!-- 2️⃣ غرفة الشات الحقيقية -->
        <section id="page-room" class="page">
            <div class="chat-room-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="icon-btn" onclick="openChatsPage()">➔</button>
                    <div class="user-avatar" id="room-avatar" style="width: 34px; height: 34px; font-size: 0.9rem;">❤️</div>
                    <div>
                        <div style="font-weight: bold; font-size: 0.88rem;" id="room-name">المستخدم</div>
                        <div style="font-size: 0.6rem; color: #00ff88;">اتصال حقيقي مباشر</div>
                    </div>
                </div>
            </div>

            <div class="messages-area" id="messages-area"></div>

            <form class="chat-bar" onsubmit="handleSendRealMessage(event)">
                <input type="text" class="chat-input" id="chat-input" placeholder="اكتب رسالة حقيقية..." autocomplete="off">
                <button type="submit" class="icon-btn" style="background: var(--primary); font-size: 1.1rem;">🕊️</button>
            </form>
        </section>

    </main>
</div>

<script>
    // إعدادات Firebase المباشرة لـ GitHub Pages
    const firebaseConfig = {
        apiKey: "AIzaSyCvu2oTi98xSIRELfpv7X_U-_Lo_isIOJQ",
        authDomain: "ad7am-f3c66.firebaseapp.com",
        databaseURL: "https://ad7am-f3c66-default-rtdb.firebaseio.com",
        projectId: "ad7am-f3c66",
        storageBucket: "ad7am-f3c66.firebasestorage.app",
        messagingSenderId: "767868074527",
        appId: "1:767868074527:web:a2a4918dad31c7220bf32a",
        measurementId: "G-XCZPMJ8J2K"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let activeChatRoomId = null;
    let isRegisterMode = false;

    // مراقبة حالة تسجيل الدخول الحقيقية
    auth.onAuthStateChanged(user => {
        if (user) {
            db.ref('users/' + user.uid).once('value', snapshot => {
                currentUser = snapshot.val();
                if (currentUser) {
                    currentUser.uid = user.uid;
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('my-avatar').innerText = currentUser.avatar || '👑';
                    document.getElementById('my-name').innerText = currentUser.name;
                    loadUserChatsList();
                }
            });
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    });

    // تبديل بين تسجيل الدخول وإنشاء الحساب
    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('group-name').style.display = isRegisterMode ? 'block' : 'none';
        document.getElementById('group-avatar').style.display = isRegisterMode ? 'block' : 'none';
        document.getElementById('auth-btn').innerText = isRegisterMode ? 'إنشاء حساب حقيقي' : 'تسجيل الدخول';
        document.getElementById('toggle-text').innerText = isRegisterMode ? 'لديك حساب بالفعل؟' : 'ليس لديك حساب؟';
        document.getElementById('toggle-link').innerText = isRegisterMode ? ' تسجيل الدخول' : ' إنشاء حساب جديد';
    }

    // إدارة التسجيل عبر Firebase Auth
    function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;

        if (isRegisterMode) {
            const name = document.getElementById('auth-name').value;
            const avatar = document.getElementById('auth-avatar').value;

            auth.createUserWithEmailAndPassword(email, pass)
                .then(cred => {
                    return db.ref('users/' + cred.user.uid).set({
                        name: name,
                        email: email,
                        avatar: avatar
                    });
                })
                .catch(err => alert("خطأ في التسجيل: " + err.message));
        } else {
            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => alert("خطأ في تسجيل الدخول: " + err.message));
        }
    }

    function logout() {
        auth.signOut().then(() => location.reload());
    }

    // تحميل قائمة المحادثات الخاصة بالمستخدم من السحابة (مع حماية ضد الثغرات)
    function loadUserChatsList() {
        db.ref('user_chats/' + currentUser.uid).on('value', snapshot => {
            const container = document.getElementById('chats-container');
            container.innerHTML = '';
            const chats = snapshot.val();

            if (!chats) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin-top:30px; font-size:0.85rem;">لا توجد محادثات حتى الآن.<br>اضغط على (+) لبدء محادثة حقيقية.</div>';
                return;
            }

            Object.keys(chats).forEach(targetUid => {
                const chat = chats[targetUid];
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.onclick = () => openChatRoom(targetUid, chat.name, chat.avatar, chat.roomId);

                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'user-avatar';
                avatarDiv.textContent = chat.avatar || '💌';

                const contentDiv = document.createElement('div');
                contentDiv.style.flex = '1';

                const nameDiv = document.createElement('div');
                nameDiv.style.fontWeight = 'bold';
                nameDiv.style.fontSize = '0.9rem';
                nameDiv.textContent = chat.name;

                const msgDiv = document.createElement('div');
                msgDiv.style.fontSize = '0.75rem';
                msgDiv.style.color = 'var(--text-sub)';
                msgDiv.textContent = chat.lastMsg || 'لا توجد رسائل';

                contentDiv.appendChild(nameDiv);
                contentDiv.appendChild(msgDiv);
                div.appendChild(avatarDiv);
                div.appendChild(contentDiv);

                container.appendChild(div);
            });
        });
    }

    // إيجاد مستخدم وبدء محادثة حقيقية
    function startNewRealChat() {
        const targetEmail = prompt("أدخل البريد الإلكتروني للمستخدم الآخر الحقيقي:");
        if (!targetEmail) return;

        db.ref('users').orderByChild('email').equalTo(targetEmail).once('value', snapshot => {
            const users = snapshot.val();
            if (!users) {
                alert("لم يتم العثور على مستخدم بهذا البريد الإلكتروني.");
                return;
            }

            const targetUid = Object.keys(users)[0];
            if (targetUid === currentUser.uid) {
                alert("لا يمكنك مراسلة نفسك!");
                return;
            }

            const targetUser = users[targetUid];
            const roomId = [currentUser.uid, targetUid].sort().join('_');

            // ربط المستخدمين معاً
            db.ref(`user_chats/${currentUser.uid}/${targetUid}`).set({
                name: targetUser.name,
                avatar: targetUser.avatar,
                roomId: roomId,
                lastMsg: "بداية المحادثة"
            });

            db.ref(`user_chats/${targetUid}/${currentUser.uid}`).set({
                name: currentUser.name,
                avatar: currentUser.avatar,
                roomId: roomId,
                lastMsg: "بداية المحادثة"
            });

            openChatRoom(targetUid, targetUser.name, targetUser.avatar, roomId);
        });
    }

    // فتح غرفة الشات واستماع الرسائل المباشرة
    function openChatRoom(targetUid, name, avatar, roomId) {
        activeChatRoomId = roomId;
        document.getElementById('page-chats').classList.remove('active');
        document.getElementById('page-room').classList.add('active');

        document.getElementById('room-name').innerText = name;
        document.getElementById('room-avatar').innerText = avatar || '❤️';

        // الاستماع الفوري للرسائل الحقيقية
        db.ref('messages/' + roomId).on('value', snapshot => {
            const container = document.getElementById('messages-area');
            container.innerHTML = '';
            const msgs = snapshot.val();

            if (msgs) {
                Object.values(msgs).forEach(m => {
                    const isMe = m.senderUid === currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'out' : 'in'}`;

                    const textDiv = document.createElement('div');
                    textDiv.textContent = m.text;

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'msg-time';
                    timeSpan.textContent = m.time;

                    div.appendChild(textDiv);
                    div.appendChild(timeSpan);

                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        });
    }

    function openChatsPage() {
        if (activeChatRoomId) db.ref('messages/' + activeChatRoomId).off();
        document.getElementById('page-room').classList.remove('active');
        document.getElementById('page-chats').classList.active;
    }

    // إرسال رسالة حقيقية في الوقت الفعلي
    function handleSendRealMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !activeChatRoomId) return;

        const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const newMsgRef = db.ref('messages/' + activeChatRoomId).push();
        newMsgRef.set({
            senderUid: currentUser.uid,
            text: text,
            time: time,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        input.value = '';
    }
</script>

</body>
</html>
